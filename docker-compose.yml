services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: suggawayz-web
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: suggawayz
      DB_USERNAME: suggawayz
      DB_PASSWORD: suggawayz_secret
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - suggawayz

  db:
    image: mysql:8.4
    container_name: suggawayz-db
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: suggawayz
      MYSQL_USER: suggawayz
      MYSQL_PASSWORD: suggawayz_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - suggawayz

  phpmyadmin:
    image: phpmyadmin:5
    container_name: suggawayz-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_secret
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - suggawayz

volumes:
  db_data:

networks:
  suggawayz:
    driver: bridge
